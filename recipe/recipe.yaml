schema_version: 1

context:
  name: airflow-balancer
  version: "0.7.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/airflow-balancer/airflow_balancer-${{ version }}.tar.gz
  sha256: 6858906512cd71295e6bc2970844f9af5357f7edc9a11f8f69d230e916edd629

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-js
    - nodejs
    - pip
    - pnpm
  run:
    - python >=${{ python_min }}
    - airflow-config >=1.12,<1.13
    - airflow-pydantic >=1.6,<1.8
    - pydantic >=2

tests:
  - python:
      imports:
        - airflow_balancer
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Utilities for load balancing DAGs
  description: Utilities for load balancing DAGs
  homepage: https://github.com/airflow-laminar/airflow-balancer
  repository: https://github.com/airflow-laminar/airflow-balancer

extra:
  recipe-maintainers:
    - timkpaine
