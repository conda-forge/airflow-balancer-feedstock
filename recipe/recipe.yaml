schema_version: 1

context:
  name: airflow-balancer
  version: "0.7.11"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/airflow-balancer/airflow_balancer-${{ version }}.tar.gz
  sha256: dd5a0e8edffd25ecd1b2cb3cc527dd3d20939a820ce7c214e815f1ab0d3838a8

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-js
    - nodejs
    - pip
    - pnpm
  run:
    - python >=${{ python_min }}
    - airflow-config >=1.12,<1.13
    - airflow-pydantic >=1.6,<1.7
    - pydantic >=2

tests:
  - python:
      imports:
        - airflow_balancer
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Utilities for load balancing DAGs
  description: Utilities for load balancing DAGs
  homepage: https://github.com/airflow-laminar/airflow-balancer
  repository: https://github.com/airflow-laminar/airflow-balancer

extra:
  recipe-maintainers:
    - timkpaine
